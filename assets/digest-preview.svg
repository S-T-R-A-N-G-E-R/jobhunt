<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 826" width="760" height="826" role="img" aria-label="Example jobhunt digest in Telegram: a header, job cards with Apply and Skip buttons, and a stretch role (fictional companies)">
  <title>Example jobhunt digest (fictional companies)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/>
      <stop offset="1" stop-color="#110a26"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de2ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2de2ff"/>
      <stop offset="1" stop-color="#5bffb0"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#b9a6ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="760" height="826" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { fill: #eaf4ff; font-size: 16px; font-weight: 600; }
    .meta { fill: #8fa3c7; font-size: 13px; }
    .pitch { fill: #c9d6ee; font-size: 13.5px; font-style: italic; }
    .body { fill: #5bffb0; font-size: 13px; }
    .flag { fill: #ffb86b; font-size: 12.5px; }
    .stretch { fill: #b9a6ff; font-size: 13px; font-weight: 600; }
    .label { fill: #b9a6ff; font-size: 14px; font-weight: 600; }
    .link { fill: #2de2ff; font-size: 12.5px; }
    .score { fill: #05060f; font-size: 15px; font-weight: 700; }
    .bubble { fill: #0a0f26; stroke: #7c5cff; stroke-opacity: .25; }
    .btn { fill: #0d1330; stroke: #2de2ff; stroke-opacity: .3; }
    .btntext { fill: #eaf4ff; font-size: 14px; font-weight: 600; }
    .in { animation: up .7s ease-out both; }
    .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .8s } .d4 { animation-delay: 1s }
    @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="760" height="826" fill="url(#bg)"/>

    <!-- chat header -->
    <rect width="760" height="72" fill="#0b1026"/>
    <line x1="0" y1="72" x2="760" y2="72" stroke="#2de2ff" stroke-opacity=".18"/>
    <circle cx="48" cy="36" r="20" fill="url(#avatar)"/>
    <text x="48" y="41" class="mono" font-size="14" font-weight="700" fill="#05060f" text-anchor="middle">jh</text>
    <text x="80" y="32" class="sans" font-size="16" font-weight="600" fill="#eaf4ff">jobhunt</text>
    <text x="80" y="52" class="sans" font-size="12.5" fill="#5bffb0">bot · daily digest · one ping</text>
    <text x="728" y="41" class="mono" font-size="12" fill="#8fa3c7" text-anchor="end" letter-spacing="1">FICTIONAL DATA</text>

    <g class="sans">
      <!-- header message: the only one that notifies -->
      <rect class="bubble" x="28" y="92" width="704" height="60" rx="16"/>
      <text x="48" y="119" fill="#eaf4ff" font-size="15.5" font-weight="600">2 new matches today · 412 jobs checked across 42 companies</text>
      <text x="48" y="140" class="meta">then one message per job, sent silently</text>

      <g class="in d1">
        <rect class="bubble" x="28" y="168" width="704" height="138" rx="16"/>
        <rect x="48" y="186" width="52" height="30" rx="15" fill="url(#hi)" filter="url(#glow)"/>
        <text x="74" y="206.5" class="score" text-anchor="middle">91</text>
        <text x="116" y="199" class="title">Orbital Labs · Senior Backend Engineer, Platform</text>
        <text x="116" y="220" class="meta">📍 Bengaluru · Hybrid · ₹48–60 LPA</text>
        <text x="48" y="248" class="pitch">Distributed systems and Python at your level; same stack as your last role.</text>
        <text x="48" y="269" class="body">✓ Owns the platform team's core services</text>
        <text x="48" y="290" class="flag">▲ on-call rotation mentioned</text>
        <text x="712" y="199" class="link" text-anchor="end">Open job ↗</text>
        <rect class="btn" x="28" y="314" width="348" height="36" rx="10"/>
        <text x="202" y="337" class="btntext" text-anchor="middle">✅ Apply</text>
        <rect class="btn" x="384" y="314" width="348" height="36" rx="10"/>
        <text x="558" y="337" class="btntext" text-anchor="middle">⏭ Skip</text>
      </g>

      <g class="in d2">
        <rect class="bubble" x="28" y="368" width="704" height="138" rx="16"/>
        <rect x="48" y="386" width="52" height="30" rx="15" fill="url(#hi)" filter="url(#glow)"/>
        <text x="74" y="406.5" class="score" text-anchor="middle">84</text>
        <text x="116" y="399" class="title">Nimbus AI · Software Engineer, Model API Platform</text>
        <text x="116" y="420" class="meta">📍 Remote (India)</text>
        <text x="48" y="448" class="pitch">Serving and API work for LLM products; strong overlap with your infra work.</text>
        <text x="48" y="469" class="body">✓ Python services behind a public API</text>
        <text x="48" y="490" class="flag">▲ small team, broad scope</text>
        <text x="712" y="399" class="link" text-anchor="end">Open job ↗</text>
        <rect class="btn" x="28" y="514" width="348" height="36" rx="10"/>
        <text x="202" y="537" class="btntext" text-anchor="middle">✅ Apply</text>
        <rect class="btn" x="384" y="514" width="348" height="36" rx="10"/>
        <text x="558" y="537" class="btntext" text-anchor="middle">⏭ Skip</text>
      </g>

      <g class="in d3">
        <rect class="bubble" x="28" y="568" width="704" height="40" rx="14"/>
        <text x="48" y="594" class="label">🧗 Stretch roles (1, above your level)</text>
      </g>

      <g class="in d4">
        <rect class="bubble" x="28" y="620" width="704" height="138" rx="16"/>
        <rect x="48" y="638" width="52" height="30" rx="15" fill="url(#mid)" filter="url(#glow)"/>
        <text x="74" y="658.5" class="score" text-anchor="middle">88</text>
        <text x="116" y="651" class="title">Kestrel Pay · Staff ML Engineer, Risk</text>
        <text x="116" y="672" class="meta">📍 Pune · Onsite · ⭐ 88 before the cap</text>
        <text x="48" y="700" class="stretch">🧗 Stretch, above your level: asks for 8+ years</text>
        <text x="48" y="721" class="pitch">Fraud models in production; the domain fits you closely.</text>
        <text x="48" y="740" class="body">✓ Same model-serving stack as your current role</text>
        <text x="712" y="651" class="link" text-anchor="end">Open job ↗</text>
        <rect class="btn" x="28" y="766" width="348" height="36" rx="10"/>
        <text x="202" y="789" class="btntext" text-anchor="middle">✅ Apply</text>
        <rect class="btn" x="384" y="766" width="348" height="36" rx="10"/>
        <text x="558" y="789" class="btntext" text-anchor="middle">⏭ Skip</text>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="758.5" height="824.5" rx="21.5" fill="none" stroke="#2de2ff" stroke-opacity=".18" stroke-width="1.5"/>
</svg>
